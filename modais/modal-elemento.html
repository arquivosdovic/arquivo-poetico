<div
    id="modal-elemento"
    class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-elemento-titulo"
    tabindex="-1"
>
    <div
        class="bg-white dark:bg-slate-900 rounded-lg w-full max-w-2xl shadow-2xl max-h-[90vh] overflow-hidden flex flex-col"
    >
        <div
            class="flex items-center justify-between px-8 pt-6 pb-3 border-b border-gray-100 dark:border-slate-700 bg-white dark:bg-slate-900 flex-shrink-0"
        >
            <h3 id="modal-elemento-titulo" class="text-xl font-bold">Novo Elemento</h3>
            <div class="flex items-center gap-1 ml-4">
                <button
                    type="button"
                    onclick="document.getElementById('form-elemento').requestSubmit()"
                    title="Salvar (atalho: Ctrl+Enter)"
                    class="w-8 h-8 flex items-center justify-center rounded-full bg-emerald-50 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-100 dark:hover:bg-emerald-900 transition-colors border border-emerald-200 dark:border-emerald-800"
                    aria-label="Salvar"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 20 20"
                        fill="currentColor"
                        class="w-4 h-4"
                    >
                        <path
                            fill-rule="evenodd"
                            d="M16.704 4.153a.75.75 0 0 1 .143 1.052l-8 10.5a.75.75 0 0 1-1.127.075l-4.5-4.5a.75.75 0 0 1 1.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 0 1 1.05-.143Z"
                            clip-rule="evenodd"
                        />
                    </svg>
                </button>
                <button
                    type="button"
                    onclick="toggleModal('modal-elemento')"
                    title="Fechar (Esc)"
                    class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-50 dark:bg-slate-800 text-gray-400 dark:text-slate-500 hover:bg-gray-100 dark:hover:bg-slate-700 hover:text-gray-600 dark:hover:text-slate-300 transition-colors border border-gray-200 dark:border-slate-700"
                    aria-label="Fechar"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 20 20"
                        fill="currentColor"
                        class="w-4 h-4"
                    >
                        <path
                            d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"
                        />
                    </svg>
                </button>
            </div>
        </div>
        <div class="overflow-y-auto flex-1 px-8 py-6">
            <form id="form-elemento" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="hidden" id="el-edit-id" />
                <div>
                    <label class="form-label">Tipo de Elemento</label>
                    <select id="el-tipo" onchange="toggleCamposIntroducao()">
                        <option value="Introdução">Introdução</option>
                        <option value="Conteúdo Multimídia">Conteúdo Multimídia</option>
                        <option value="Comentário">Comentário</option>
                        <option value="Respiro (Imagem)">Respiro (Imagem)</option>
                        <option value="Posfácio">Posfácio</option>
                    </select>
                </div>
                <div>
                    <label class="form-label"
                        >Identificação / Nome
                        <span class="text-gray-400 dark:text-slate-500 font-normal normal-case"
                            >(opcional)</span
                        ></label
                    >
                    <input
                        type="text"
                        id="el-titulo"
                        placeholder="Ex: Epígrafe, Nota de abertura, Respiro I..."
                    />
                </div>
                <div>
                    <label class="form-label">Vincular a (Livro/Parte/Seção)</label>
                    <select id="el-vinculo"></select>
                </div>
                <div>
                    <label class="form-label">Sequência</label>
                    <input type="number" id="el-sequencia" class="form-input" placeholder="Ex: 1" />
                </div>
                <div
                    id="campos-introducao"
                    class="hidden md:col-span-2 space-y-4 border-l-4 border-blue-200 dark:border-blue-800 pl-4 py-2 bg-blue-50/30 dark:bg-blue-950/30"
                >
                    <div>
                        <label class="form-label text-blue-800 dark:text-blue-200"
                            >Aviso de Conteúdo (Gatilhos/Notas)</label
                        >
                        <textarea
                            id="el-aviso"
                            class="h-20"
                            placeholder="Ex: Contém temas de luto.&#10;Pode ser sensível para alguns leitores."
                        ></textarea>
                    </div>
                    <div>
                        <label class="form-label text-blue-800 dark:text-blue-200"
                            >Versos pós-Introdução</label
                        >
                        <textarea
                            id="el-pos-versos"
                            class="h-20 font-serif"
                            placeholder="Versos que aparecem após o texto introdutório..."
                        ></textarea>
                    </div>
                </div>
                <div class="md:col-span-2">
                    <label class="form-label">Conteúdo (Texto)</label>
                    <textarea id="el-texto" class="h-24"></textarea>
                </div>
                <div class="md:col-span-2">
                    <label
                        class="block text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase mb-1"
                        >Notas de Contexto</label
                    >
                    <textarea
                        id="el-notas"
                        class="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 outline-none"
                        placeholder="Ex: Este texto deve ficar logo abaixo da foto da capa..."
                    ></textarea>
                </div>
                <div class="md:col-span-2">
                    <label class="form-label">Imagem (Para Respiros/Multimídia)</label>
                    <input type="file" id="el-img" accept="image/*" />
                    <div class="flex items-center gap-2 mt-1">
                        <input type="checkbox" id="el-remover-imagem" />
                        <label class="text-sm">Remover imagem atual</label>
                    </div>
                </div>
                <div
                    class="md:col-span-2 flex justify-end gap-2 pt-4 border-t border-gray-200 dark:border-slate-700"
                >
                    <button
                        type="button"
                        onclick="toggleModal('modal-elemento')"
                        class="text-gray-600 dark:text-slate-300 px-4 py-2"
                    >
                        Sair
                    </button>
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded">
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
